<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

        /*# = id
        . = class
        : pseudo-class
        ::pseudo-elements
        > = children
        SELETORES PERSONALIZADOS*/  




        body{
            font-family: Arial, Helvetica, sans-serif;

        }
        
        a{ /*deixa o link com cor*/
            color: rgb(8, 0, 255);
            text-decoration: none;
            font-weight: bold;
        }

        a:visited{ /*deixa o link com outra cor após ser visitado*/
            color: rgb(255, 0, 0);
        }

        a:hover{  /*houver é estilo do css para que estilize algo e mostre para o usuario quando o cursor do mouse passa em cima*/

            color: black;
            text-decoration: underline;
        }

        a:active{
            color: aqua;
        }

        .especial{
            background-color: aqua;
        }


        a::after {/*pseudo-elemnto()*/
            content: '[link]';
            text-decoration: none;
            font-weight: normal;
            color: black;
        }


    </style>
</head>
<body>
    <h1>Persolanizando Links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io" target="_blank">Repositorio GitHub</a></li>
        <li><a href="https://youtube.com/@canalaquelescaras/"class="especial">Canal Youtube</a></li>
        <li><a href="https://www.cursoemvideo.com">Site Artesanato</a></li>
    </ul>
</body>
</html>
